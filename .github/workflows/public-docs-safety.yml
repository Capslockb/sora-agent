name: public-docs-safety

on:
  pull_request: {}
  push:
    branches: [main, master, release/**]

permissions:
  contents: read

jobs:
  public-docs-safety:
    name: public-docs-safety
    runs-on: ubuntu-latest
    env:
      PUBLIC_DOCS_BASE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: public-docs-safety
        run: python3 scripts/public_docs_safety_entrypoint_v3.py
      - name: scanner regression tests
        run: python3 -m unittest discover -s tests -p 'test_public_docs*.py'
