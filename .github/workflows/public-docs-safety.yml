name: public-docs-safety

on:
  pull_request: {}
  push:
    branches: [main, master, release/**]
    paths:
      - README
      - '**/README'
      - README.md
      - '**/README.md'
      - SECURITY.md
      - '**/SECURITY.md'
      - CONTRIBUTING.md
      - '**/CONTRIBUTING.md'
      - CODE_OF_CONDUCT.md
      - '**/CODE_OF_CONDUCT.md'
      - AGENTS.md
      - '**/AGENTS.md'
      - docs/**
      - '**/docs/**'
      - doc/**
      - '**/doc/**'
      - site/**
      - '**/site/**'
      - website/**
      - '**/website/**'
      - public/**
      - '**/public/**'
      - .github/CODEOWNERS
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/pull_request_template.md
      - .github/PULL_REQUEST_TEMPLATE/**
      - .github/pull_request_template/**
      - .github/workflows/public-docs-safety.yml
      - scripts/public_docs_safety.py
      - scripts/public_docs_safety_hardened.py
      - 'tests/test_public_docs*.py'
      - tests/fixtures/public-docs/**

permissions:
  contents: read

jobs:
  public-docs-safety:
    name: public-docs-safety
    runs-on: ubuntu-latest
    env:
      PUBLIC_DOCS_BASE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: public-docs-safety
        run: python3 scripts/public_docs_safety_hardened.py
      - name: scanner regression tests
        run: python3 -m unittest discover -s tests -p 'test_public_docs*.py'
